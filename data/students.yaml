lab_name: "CASE Lab"
lab_description: >
  CASE (Collaborative, Automated, Scalable, and Efficient Intelligence) Lab
  is an active research group at University of Maryland College Park. Our research
  interests lie in developing cutting-edge algorithms and systems that are not only
  robust and efficient but also scalable across diverse applications.

