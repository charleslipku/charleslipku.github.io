- date: "2026-05-01"
  text: >
    We have three papers (2 main track, 1 position paper) that have been accepted by ICML 2026! Congratulations to Shwai, Guoheng, Ziyao, and our collaborators..

- date: "2026-04-06"
  text: >
    We have three papers (1 main conference, 2 findings) that have been accepted by ACL 2026! Congratulations to Shwai, Guoheng, and our collaborators.

- date: "2026-02-21"
  text: >
    Our paper "UniCompress: Token Compression for Unified Vision–Language Understanding and Generation" has been accepted by CVPR 2026! Congratulations to Ziyao.

- date: "2026-01-24"
  text: >
    Our paper "Capacity-Aware Inference: Mitigating the Straggler Effect in Mixture of Experts" has been accepted by ICLR 2026! Congratulations to Shwai.

- date: "2026-01-23"
  text: >
    I am deeply honored for receiving 2026 CPAL Rising Stars Award! Many thanks for the acknowledgment.

- date: "2025-06-07"
  text: >
    I am very thrilled to share that two Ph.D. students (Guoheng Sun and Shwai He) in our group have been awarded Qualcomm Innovation Fellowship, and they are one of only 17 teams receiving the 2025 award!

- date: "2025-05-01"
  text: >
    Our paper "Speculate, then Collaborate: Fusing Knowledge of Language Models during Decoding" has been accepted by ICML 2025!

- date: "2025-04-07"
  text: >
    Our paper "EdgeLoRA: An Efficient Multi-Tenant LLM Serving System on Edge Devices" has been accepted by 2025 ACM MobiSys!

- date: "2025-01-22"
  text: >
    Our paper "Towards Counterfactual Fairness thorough Auxiliary Variables" has been accepted by ICLR 2025!

- date: "2025-01-15"
  text: >
    I have received the Cisco Research Award! I deeply appreciate Cisco's generous support, which will empower our ongoing research and innovation.

- date: "2025-01-15"
  text: >
    I have been invited to serve as an Associate Editor of IEEE Transactions on Neural Networks and Learning Systems (TNNLS).

- date: "2024-10-16"
  text: >
    Our paper "Moderator: Moderating Text-to-Image Diffusion Models through Fine-grained Context-based Policies" received Distinguished Paper Award at ACM CCS'24. Congrats to all the co-authors!

- date: "2024-09-26"
  text: >
    We have three papers accepted by NeurIPS 2024 (2 Main Conference + 1 Dataset & Benchmark Track)! Congratulations to my students and collaborators.

- date: "2024-08-26"
  text: >
    Invited to serve as area chair for ICLR 2025.

- date: "2024-02-26"
  text: >
    Our research paper titled "MAPSeg: Unified Unsupervised Domain Adaptation for Heterogeneous Medical Image Segmentation Based on 3D Masked Autoencoding and Pseudo-Labeling" has been accepted by CVPR 2024.

- date: "2024-02-24"
  text: >
    Our research paper titled "SiDA: Sparsity-Inspired Data-Aware Serving for Efficient and Scalable Large Mixture-of-Experts Models" has been accepted by MLSys 2024.

- date: "2024-01-22"
  text: >
    Our research paper titled "FedHyper: A Universal and Robust Learning Rate Scheduler for Federated Learning with Hypergradient Descent" and "Enhancing One-Shot Federated Learning Through Data and Ensemble Co-Boosting" have been accepted by ICLR 2024.

- date: "2023-10-07"
  text: >
    Our research paper titled "FedNAR: Federated Optimization with Normalized Annealing Regularization" has been accepted by NeurIPS 2023.

- date: "2023-08-14"
  text: >
    I am deeply honored and thrilled to share that I have been selected as the recipient of the IEEE Cyber-Physical Systems (TCCPS) Outstanding Ph.D. Dissertation Award!

- date: "2023-05-08"
  text: >
    I am beyond thrilled to share that I have been selected as one of the two recipients for the ECE Department Outstanding Ph.D. Dissertation Award for the academic year 22-23 at Duke University!

- date: "2023-04-27"
  text: >
    Our research paper titled "Fed-CBS: A Heterogeneity-Aware Client Sampling Mechanism for Federated Learning via Class-Imbalance Reduction" has been accepted for presentation at ICML 2023.

- date: "2023-04-25"
  text: >
    I am beyond thrilled to share that I have been selected as one of the two recipients for the ECE Department Outstanding Ph.D. Dissertation Award for the academic year 22-23 at Duke University!

- date: "2023-03-15"
  text: >
    Our paper "AutoFed: Heterogeneity-Aware Federated Multimodal Learning for Robust Autonomous Driving" has been accepted by MobiCom 2023!

- date: "2022-10-10"
  text: >
    Our paper "FedSEA: A Semi-Asynchronous Federated Learning Framework for Extremely Heterogeneous Devices" has been accepted by SenSys 2022!

- date: "2022-10-01"
  text: >
    Our paper "GraphFL: A Federated Learning Framework for Semi-Supervised Node Classification on Graphs" has been accepted by ICDM 2022!

- date: "2022-07-15"
  text: >
    Very honored to co-chair the 3rd DistributedML workshop co-located with CoNEXT 2022. We welcome works at the intersection of distributed systems, machine learning, and networks.
