<section id="about" class="section hero-section">
  <div class="hero">
    <div class="hero-photo">
      <img src="{{ .Site.Params.profileImage }}" alt="Photo of {{ .Site.Title }}">
    </div>
    <div class="hero-bio">
      <h1>{{ .Site.Title }}</h1>
      <p class="hero-subtitle">{{ .Site.Params.description }}</p>
      <div class="bio-content">
        {{ .Content }}
      </div>
      <div class="social-links">
        {{ with .Site.Params.email }}
        <a href="mailto:{{ . }}" title="Email">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </a>
        {{ end }}
        {{ with .Site.Params.scholar }}
        <a href="https://scholar.google.com/citations?user={{ . }}" target="_blank" title="Google Scholar">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-2a5 5 0 1 0 0-10 5 5 0 0 0 0 10z"/><path d="M12 11.5V18" stroke="white" stroke-width="1.5"/><circle cx="12" cy="9" r="1.5" fill="white"/><path d="m0 9.5 12-7 12 7"/><path d="M21 9.5v7"/></svg>
        </a>
        {{ end }}
        {{ with .Site.Params.linkedin }}
        <a href="https://www.linkedin.com/in/{{ . }}" target="_blank" title="LinkedIn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"/></svg>
        </a>
        {{ end }}
        {{ with .Site.Params.twitter }}
        <a href="https://twitter.com/{{ . }}" target="_blank" title="Twitter">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        {{ end }}
        {{ with .Site.Params.github }}
        <a href="https://github.com/{{ . }}" target="_blank" title="GitHub">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
        {{ end }}
      </div>
    </div>
  </div>
</section>
