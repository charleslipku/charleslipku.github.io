<section id="teaching" class="section">
  <h2>Teaching</h2>
  {{ range .Site.Data.teaching }}
  <div class="collapsible">
    <button class="collapsible-header">
      <span>{{ .code }}: {{ .title }} ({{ .semester }})</span>
      <span class="collapsible-icon">+</span>
    </button>
    <div class="collapsible-body">
      <p>{{ .description }}</p>
      <ul>
        {{ with .prerequisite }}<li><strong>Prerequisite:</strong> {{ . }}</li>{{ end }}
        {{ with .schedule }}<li><strong>Lectures:</strong> {{ . }}</li>{{ end }}
      </ul>
      {{ with .url }}<p><a href="{{ . }}" target="_blank">Course Website</a></p>{{ end }}
    </div>
  </div>
  {{ end }}
</section>
